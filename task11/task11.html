<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 11 </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .accordion-header {
            width: 400px;
            padding: 15px;
            background-color: royalblue;
            color: white;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            margin-top: 5px;
        }

        .accordion-content {
            width: 370px;
            padding: 15px;
            background-color: #f1f1f1;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Task 11: Accordion Menu</h1>

    <h2>Frequently Asked Questions</h2>

    <button class="accordion-header">
        What is jQuery?
    </button>
    <div class="accordion-content">
        <p>jQuery is a JavaScript library that makes HTML manipulation easier.</p>
    </div>

    <button class="accordion-header">
        What is HTML?
    </button>
    <div class="accordion-content">
        <p>HTML is used to create the structure of web pages.</p>
    </div>

    <button class="accordion-header">
        What is CSS?
    </button>
    <div class="accordion-content">
        <p>CSS is used to style and design web pages.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="task11.js"></script>

</body>
</html>
